name: Frontend CI/CD

# Runs only when something inside backend/ changes (push or PR to main).
# Deploy runs ONLY on push to main, and ONLY if all three test jobs pass.
on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"

# Cancel an in-progress run if a newer commit arrives on the same branch
concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

jobs:
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    # Deploy only if  on a real push to main
    # (never on pull requests)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Vercel deploy hook
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}")
          if [ "$response" -ge 200 ] && [ "$response" -lt 300 ]; then
            echo "✅ Vercel deploy triggered successfully (HTTP $response)"
          else
            echo "❌ Vercel deploy hook failed (HTTP $response)"
            exit 1
          fi